name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: make check
        if: github.event_name == 'pull_request'
      - name: Check gateway probe acceptance
        run: PYTHONOPTIMIZE=1 python3 -B -m unittest discover -s experiments/agentgateway -p 'test_*.py'
      - name: Run native release tests
        run: |
          cargo test --locked --all-features --bin steve native_
          cargo test --locked --all-features --test e2e_native
        if: github.event_name == 'pull_request'
      - name: Run Linux accounting end-to-end tests
        run: cargo test --locked --test e2e_accounting
        if: github.event_name == 'pull_request'
      - run: make quality-gates
        if: github.event_name == 'push'
      - name: Verify Cargo.lock is unchanged
        run: git diff --exit-code -- Cargo.lock

  official-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned test SDKs
        run: |
          python3 -m venv "$RUNNER_TEMP/steve-sdk-venv"
          "$RUNNER_TEMP/steve-sdk-venv/bin/python" -m pip install -r tests/requirements-sdk.txt
          "$RUNNER_TEMP/steve-sdk-venv/bin/python" -c 'from importlib.metadata import version; print("anthropic=" + version("anthropic")); print("openai=" + version("openai"))'
      - name: Build Steve
        run: cargo build --locked --all-features
      - name: Exercise official SDKs against local Steve
        timeout-minutes: 2
        env:
          PYTHONOPTIMIZE: "1"
        run: '"$RUNNER_TEMP/steve-sdk-venv/bin/python" scripts/sdk_smoke.py --provider all --binary target/debug/steve'

  m1-release-gate:
    needs: m1-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: steve_m1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d steve_m1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      M1_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      M1_DEPLOYMENT_PATH: /var/lib/steve/accounting
      STEVE_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/steve_m1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download exact-candidate M1 mutation evidence
        uses: actions/download-artifact@v4
        with:
          name: m1-mutation-${{ env.M1_EXPECTED_SHA }}
          path: target/m1-mutations
      - name: Verify M1 mutation outcomes
        run: |
          python3 -B scripts/qualify_m1_mutations.py --verify target/m1-mutations/result.json --expected-sha "$M1_EXPECTED_SHA"
          cp target/m1-mutations/result.json target/m1-mutation-result.json
      - name: Run exact-candidate M1 functional gate
        run: make m1-release-gate
      - name: Upload M1 gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-release-gate-${{ env.M1_EXPECTED_SHA }}
          path: target/m1-release-gate.json
          if-no-files-found: error

  windows-ntfs-process-semantics:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      M1_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONOPTIMIZE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check exact candidate and runner tests
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:M1_EXPECTED_SHA) { throw "candidate SHA mismatch" }
          python -B -m unittest discover -s scripts -p test_m1_release_gate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build exact Windows candidate
        if: always()
        run: cargo build --locked --all-features
      - name: Probe runner NTFS process semantics
        if: always()
        shell: pwsh
        run: |
          $parent = Join-Path $env:RUNNER_TEMP "steve-m1-ntfs"
          New-Item -ItemType Directory -Path $parent -ErrorAction Stop | Out-Null
          $deployment = Join-Path $parent "unused-accounting-root"
          $evidence = Join-Path $env:RUNNER_TEMP "m1-windows-ntfs-ci-process-semantics.json"
          python -B scripts/m1_release_gate.py --qualify-target $parent --deployment-path $deployment --candidate-binary target/debug/steve.exe --expected-sha $env:M1_EXPECTED_SHA --evidence-scope ci-runner-process-semantics --output $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify runner evidence binding and release rejection
        if: always()
        shell: bash
        run: |
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          import m1_release_gate as gate

          artifact = Path(os.environ["RUNNER_TEMP"]) / "m1-windows-ntfs-ci-process-semantics.json"
          evidence = json.loads(artifact.read_text(encoding="utf-8"))
          gate.require(evidence.get("source_sha") == os.environ["M1_EXPECTED_SHA"], "CI evidence SHA mismatch")
          gate.require(evidence.get("binary_sha256") == gate.sha256(Path("target/debug/steve.exe")), "CI binary hash mismatch")
          gate.require(evidence.get("evidence_scope") == "ci-runner-process-semantics", "CI evidence scope mismatch")
          gate.require(evidence.get("filesystem") == "ntfs", "CI runner filesystem is not NTFS")
          volume = evidence.get("target_volume", {})
          gate.require(volume.get("filesystem", "").upper() == "NTFS" and volume.get("guid") and volume.get("root"), "CI volume identity missing")
          gate.require(volume.get("drive_type") in {2, 3, 6}, "CI volume is not local")
          try:
              gate.load_target_qualification(artifact, os.environ["M1_EXPECTED_SHA"], evidence["binary_sha256"], Path(evidence["deployment_path"]))
          except RuntimeError as error:
              gate.require("scope" in str(error), f"CI artifact rejection did not use scope: {error}")
          else:
              raise RuntimeError("CI artifact was accepted as deployment evidence")
          gate.require(evidence.get("status") == "PASS", f"CI process probe failed: {evidence.get('error')}")
          gate.require(evidence.get("checks") == {name: "PASS" for name in gate.TARGET_CHECKS}, "CI process checks incomplete")
          gate.require(evidence.get("target_volume") == evidence.get("intended_volume") == evidence.get("probe_volume"), "CI volume identity mismatch")
          PY
      - name: Upload Windows runner process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-windows-ntfs-ci-process-semantics
          path: ${{ runner.temp }}/m1-windows-ntfs-ci-process-semantics.json
          if-no-files-found: warn

  cross-platform:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check macOS
        if: runner.os == 'macOS'
        run: make check
      - name: Check native local controller
        if: runner.os == 'macOS'
        run: |
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/steve-fixture"
          chmod +x "$RUNNER_TEMP/steve-fixture"
          touch "$RUNNER_TEMP/native-fixture.toml"
          bash macos/SteveLocal/build.sh "$RUNNER_TEMP/steve-fixture" "$RUNNER_TEMP/native-fixture.toml" "$RUNNER_TEMP/Steve.app"
      - name: Check Windows
        if: runner.os == 'Windows'
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo check --locked --all-targets --all-features

  integrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: steve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d steve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: PostgreSQL doctor
        env:
          STEVE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/steve
          STEVE_OBJECT_STORE: fs
          STEVE_OBJECT_ROOT: /tmp/steve-objects
        run: cargo run --locked -- doctor

      - name: PostgreSQL database serve parity
        env:
          STEVE_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/steve
        run: cargo test --locked --test e2e --all-features database_backend_contract

      - name: Start S3-compatible test server
        run: |
          # Distro pyOpenSSL still references cryptography's GEN_EMAIL symbol.
          # Moto upgrades cryptography, so install a matching pyOpenSSL into the
          # user site, where it is imported ahead of the distro package.
          # The moto_server script lands in ~/.local/bin, which is not on PATH.
          python -m pip install "moto[server]==5.2.3" "pyOpenSSL==26.4.0"
          S3_IGNORE_SUBDOMAIN_BUCKETNAME=true python -m moto.server -H 127.0.0.1 -p 5000 >/tmp/moto.log 2>&1 &
          python - <<'PY'
          import socket
          import time

          deadline = time.time() + 60
          while True:
              try:
                  with socket.create_connection(("127.0.0.1", 5000), timeout=1):
                      break
              except OSError:
                  if time.time() >= deadline:
                      try:
                          print(open("/tmp/moto.log", encoding="utf-8").read())
                      except OSError as log_error:
                          print(f"moto log unavailable: {log_error}")
                      raise
                  time.sleep(1)
          PY
          python - <<'PY'
          import boto3
          s3 = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:5000",
              aws_access_key_id="test",
              aws_secret_access_key="test",
              region_name="us-east-1",
          )
          s3.create_bucket(Bucket="steve")
          PY

      - name: Object store backend parity
        env:
          STEVE_TEST_S3_ENDPOINT: http://127.0.0.1:5000
        run: cargo test --locked --bin steve --all-features object_store_backend_contract -- --nocapture

      - name: S3-compatible doctor
        env:
          STEVE_DATABASE_URL: sqlite:///tmp/steve-s3.db?mode=rwc
          STEVE_OBJECT_STORE: s3
          STEVE_OBJECT_ROOT: /
          STEVE_S3_BUCKET: steve
          STEVE_S3_ENDPOINT: http://127.0.0.1:5000
          STEVE_S3_REGION: us-east-1
          STEVE_S3_ACCESS_KEY_ID: test
          STEVE_S3_SECRET_ACCESS_KEY: test
        run: cargo run --locked -- doctor

  container:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t steve:test .

  m1-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      M1_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare locked dependencies
        run: cargo fetch --locked
      - name: Check M1 mutation runner
        run: |
          python3 -B scripts/test_qualify_m1_mutations.py
          PYTHONOPTIMIZE=1 python3 -B scripts/test_qualify_m1_mutations.py
      - name: Qualify all three M1 faults at the exact candidate
        run: |
          python3 -B scripts/qualify_m1_mutations.py --output "$RUNNER_TEMP/steve-m1-mutations" --expected-sha "$M1_EXPECTED_SHA"
          python3 -B scripts/qualify_m1_mutations.py --verify "$RUNNER_TEMP/steve-m1-mutations/result.json" --expected-sha "$M1_EXPECTED_SHA"
      - name: Retain exact-candidate M1 mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-mutation-${{ env.M1_EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/steve-m1-mutations/result.json
            ${{ runner.temp }}/steve-m1-mutations/**/*.log
          if-no-files-found: error

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check out exact PR head and detect mutation scope
        id: scope
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "mutation qualification source SHA: $actual"
          test "$actual" = "$PR_HEAD_SHA"
          git cat-file -e "$PR_BASE_SHA^{commit}" || git fetch --no-tags origin "$PR_BASE_SHA"
          git diff --name-only --no-renames "$PR_BASE_SHA" "$PR_HEAD_SHA" > "$RUNNER_TEMP/steve-changed-paths"
          changed=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ci.yml|Cargo.toml|Cargo.lock|*/Cargo.toml|*/Cargo.lock|src/proxy/*.rs|src/server.rs|src/lifecycle.rs|src/test_upstream.rs|tests/e2e_messages.rs|tests/e2e_responses.rs|tests/e2e_provider_fixture.rs|tests/support/upstream.rs|tests/support/process.rs|tests/mutations/buffer-until-eof.patch|scripts/qualify_buffering.py|scripts/test_qualify_buffering.py|scripts/check_mutation_outcomes.py|scripts/test_check_mutation_outcomes.py)
                changed=true
                ;;
            esac
          done < "$RUNNER_TEMP/steve-changed-paths"
          echo "run=$changed" >> "$GITHUB_OUTPUT"
          echo "targeted mutation qualification: $changed"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
      - name: Prepare Rust dependencies
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 30
        run: make check
      - name: Check buffering runner cleanup
        if: steps.scope.outputs.run == 'true'
        run: python3 -B scripts/test_qualify_buffering.py
      - name: Check mutation outcome verifier
        if: steps.scope.outputs.run == 'true'
        run: python3 -B -m unittest discover -s scripts -p test_check_mutation_outcomes.py
      - name: Install pinned cargo-mutants
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 20
        run: |
          mutation_tools="$RUNNER_TEMP/steve-mutation-tools"
          cargo install cargo-mutants --version 27.1.0 --locked --root "$mutation_tools" --jobs 2
          echo "$mutation_tools/bin" >> "$GITHUB_PATH"
          version=$(PATH="$mutation_tools/bin:$PATH" cargo mutants --version)
          echo "cargo-mutants version: $version"
          test "$version" = "cargo-mutants 27.1.0"
      - name: List cancellation mutant
        id: cancel_list
        if: steps.scope.outputs.run == 'true'
        run: |
          cargo mutants --no-config --file src/proxy/stream.rs \
            --re '<impl Drop for DisconnectStream>::drop' --all-features --list --json \
            > "$RUNNER_TEMP/steve-cancel-list.json"
          python3 -B scripts/check_mutation_outcomes.py list cancel "$RUNNER_TEMP/steve-cancel-list.json"
      - name: Run cancellation mutation
        id: cancel_mutation
        if: steps.cancel_list.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: |
          unset CARGO_TARGET_DIR
          CARGO_NET_OFFLINE=true CARGO_BUILD_JOBS=2 cargo mutants --no-config \
            --file src/proxy/stream.rs --re '<impl Drop for DisconnectStream>::drop' \
            --all-features --jobs 1 --jobserver-tasks 2 --build-timeout 600 --timeout 30 \
            --copy-target false --output "$RUNNER_TEMP/steve-cancel" \
            -- --test e2e_responses --test e2e_messages
      - name: List replay mutation
        id: replay_list
        if: steps.scope.outputs.run == 'true'
        run: |
          cargo mutants --no-config --file src/proxy/stream.rs \
            --re 'ReplayGate::ensure_can_attempt' --all-features --list --json \
            > "$RUNNER_TEMP/steve-replay-list.json"
          python3 -B scripts/check_mutation_outcomes.py list replay "$RUNNER_TEMP/steve-replay-list.json"
      - name: Run replay mutation
        id: replay_mutation
        if: steps.replay_list.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: |
          unset CARGO_TARGET_DIR
          CARGO_NET_OFFLINE=true CARGO_BUILD_JOBS=2 cargo mutants --no-config \
            --file src/proxy/stream.rs --re 'ReplayGate::ensure_can_attempt' \
            --all-features --jobs 1 --jobserver-tasks 2 --build-timeout 600 --timeout 30 \
            --copy-target false --cargo-arg=--bin --cargo-arg=steve \
            --output "$RUNNER_TEMP/steve-replay" \
            -- proxy::stream::tests::no_replay_after_output_begun
      - name: Qualify reviewed buffering fault
        id: buffering
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 45
        shell: bash
        run: |
          python3 -B scripts/qualify_buffering.py --output "$RUNNER_TEMP/steve-buffering"
          python3 - "$RUNNER_TEMP/steve-buffering/result.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as result_file:
              result = json.load(result_file)
          print(json.dumps(result, sort_keys=True))
          assert result.get("source_head") == os.environ["PR_HEAD_SHA"]
          assert result.get("source_dirty") is False
          assert result.get("status") == "caught"
          PY
      - name: Verify and print mutation evidence
        if: always() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          status=0
          if [ "${{ steps.cancel_mutation.outcome }}" != success ]; then
            echo "cancellation cargo-mutants step outcome: ${{ steps.cancel_mutation.outcome }}"
            status=1
          fi
          if [ "${{ steps.replay_mutation.outcome }}" != success ]; then
            echo "replay cargo-mutants step outcome: ${{ steps.replay_mutation.outcome }}"
            status=1
          fi
          python3 -B scripts/check_mutation_outcomes.py verify cancel \
            "$RUNNER_TEMP/steve-cancel/mutants.out" "$PR_HEAD_SHA" || status=1
          python3 -B scripts/check_mutation_outcomes.py verify replay \
            "$RUNNER_TEMP/steve-replay/mutants.out" "$PR_HEAD_SHA" || status=1
          exit "$status"
