name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: make quality-gates

  cross-platform:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check macOS
        if: runner.os == 'macOS'
        run: make check
      - name: Check Windows
        if: runner.os == 'Windows'
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo check --all-targets --all-features

  integrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: steve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d steve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: PostgreSQL doctor
        env:
          STEVE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/steve
          STEVE_OBJECT_STORE: fs
          STEVE_OBJECT_ROOT: /tmp/steve-objects
        run: cargo run -- doctor

      - name: Start S3-compatible test server
        run: |
          python -m pip install "moto[server]==5.2.3"
          S3_IGNORE_SUBDOMAIN_BUCKETNAME=true moto_server -H 127.0.0.1 -p 5000 >/tmp/moto.log 2>&1 &
          python - <<'PY'
          import socket
          import time

          deadline = time.time() + 60
          while True:
              try:
                  with socket.create_connection(("127.0.0.1", 5000), timeout=1):
                      break
              except OSError:
                  if time.time() >= deadline:
                      raise
                  time.sleep(1)
          PY
          python - <<'PY'
          import boto3
          s3 = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:5000",
              aws_access_key_id="test",
              aws_secret_access_key="test",
              region_name="us-east-1",
          )
          s3.create_bucket(Bucket="steve")
          PY

      - name: S3-compatible doctor
        env:
          STEVE_DATABASE_URL: sqlite:///tmp/steve-s3.db?mode=rwc
          STEVE_OBJECT_STORE: s3
          STEVE_OBJECT_ROOT: /
          STEVE_S3_BUCKET: steve
          STEVE_S3_ENDPOINT: http://127.0.0.1:5000
          STEVE_S3_REGION: us-east-1
          STEVE_S3_ACCESS_KEY_ID: test
          STEVE_S3_SECRET_ACCESS_KEY: test
        run: cargo run -- doctor

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t steve:test .
