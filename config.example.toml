[server]
# [::] with dual-stack enabled accepts both IPv6 and IPv4 connections.
bind = "[::]:11435"
drain_timeout_seconds = 60

[database]
url = "sqlite://data/steve.db?mode=rwc"
hot_max_connections = 8
background_max_connections = 4

[object_storage]
kind = "fs"
root = "data/objects"
# For S3-compatible storage:
# kind = "s3"
# root = "/steve"
# bucket = "steve"
# endpoint = "http://127.0.0.1:9000"
# region = "us-east-1"
# access_key_id = "..."
# secret_access_key = "..."

[queues]
accounting = 4096
# Authoritative accounting spills here if the primary async queue or DB is unavailable.
accounting_journal = "data/accounting-overflow.jsonl"
accounting_journal_queue = 1024
history = 2048
telemetry = 8192

[logging]
level = "info"
json = false
