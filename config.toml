[server]
inference_bind = "[::]:11435"
management_bind = "[::]:8790"
drain_timeout_seconds = 60

[database]
url = "sqlite://data/steve.db?mode=rwc"
hot_max_connections = 8
background_max_connections = 4

[object_storage]
kind = "fs"
root = "data/objects"

[queues]
accounting = 4096
accounting_journal = "/var/lib/steve/accounting"
accounting_journal_queue = 1024
history = 2048
telemetry = 8192

[logging]
level = "info"
json = false

[[models]]
id = "steve-test-model"
owned_by = "steve"
